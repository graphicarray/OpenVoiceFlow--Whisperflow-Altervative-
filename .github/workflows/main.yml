name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Ensure .env file exists for electron-builder extraResources
        shell: pwsh
        run: |
          if (!(Test-Path ".env")) {
            if (Test-Path ".env.example") {
              Copy-Item ".env.example" ".env"
            } else {
              New-Item -ItemType File -Path ".env" -Force | Out-Null
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Download required Windows runtime binaries and models
        run: |
          npm run prebuild:win
          npm run download:embedding-model -- --for-build

      - name: Build renderer (Vite) and package Windows NSIS installer (.exe)
        run: npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false npm run build:renderer && npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows .exe Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Voice-Flow-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (on version tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          generate_release_notes: true
